name: Build Sizzle

# Builds the Android APK and an (unsigned) iOS app on every push to main, and
# on demand from the Actions tab. Artifacts are attached to each run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sizzle-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Force CocoaPods instead of Swift Package Manager: SPM resolves a
      # Firebase iOS SDK that doesn't match cloud_firestore's native code
      # (FLTPipelineParser.m fails to compile), whereas the CocoaPods path pins
      # a matching Firebase SDK version.
      - run: flutter config --no-enable-swift-package-manager

      # No Apple signing certificate needed — this proves the app compiles for
      # iOS and produces a .app. A signed, installable .ipa requires an Apple
      # Developer account (add signing secrets to enable it later).
      - run: flutter build ios --release --no-codesign

      - name: Zip the .app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sizzle-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error
